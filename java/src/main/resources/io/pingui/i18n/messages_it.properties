about.repository=Repository:
about.summary=Monitora RTT e rotte fino a 10 destinazioni (IPv4/IPv6 literal o hostname). Sessione: RAM o SQLite (Impostazioni → Database…). Telemetria / sink LOG: Impostazioni → Telemetria… (YAML telemetry:).
help.title=Guida PINGUI
help.header=Guida rapida
help.documentation=Documentazione:
help.expert_linux=Esperto (Linux) — Exten. imposta i parametri ping(8) iputils.
help.expert_unavailable=Esperto non disponibile su questo SO (solo Linux, iputils ping).
help.accelerators=Scorciatoie\n• F1 — Guida\n• Ctrl/Cmd+S — Salva (YAML)\n• Ctrl/Cmd+N — Aggiungi destinazione\n
help.body=Profili e destinazioni\n• Più profili di tracciamento in un YAML; cambio con Profilo.\n• Fino a 10 IP (IPv4/IPv6 literal) o hostname; la casella abilita il monitoraggio.\n• IPv6 literal — trace con traceroute -6; su Linux con ICMP raw — fallback a process.\n• Ping only — solo RTT senza traceroute (consigliato su Windows).\n\nModalità UI\n• Semplice — elenco compatto con RTT e loss %.\n• Esteso — grafo hop e diario dei cambi rotta.\n• Grafo: rotella — zoom, trascinamento — pan, hover — tooltip; doppio clic — copia IP.\n• {0}\n\nImpostazioni\n• Database… — sessione SQLite (cronologia route_change), non archivio telemetria.\n• Profilo… — interval / max_hops / timeout / probe; Applica + Salva.\n• Avvisi… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetria… — sink (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Esporta ora… — report CSV/HTML (come --export-report); serve SQLite.\n• persistence.session_db ≠ telemetry.sqlite (ruoli diversi).\n\nExpert ping (Linux)\n• Esperto → Exten. / MTU — preset, MTU wizard e Self-check (DF/DSCP/Burst → Alert).\n• Preset “MTU probe” ≠ sweep MTU: usa MTU / “MTU wizard…” (sweep -s + -M do → Applica).\n• Self-check — batch breve DF/DSCP/Burst con ProgressBar; non modifica il form Expert.\n\n{1}CLI (terminale)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sink.\n• --lang CODE — lingua UI (uk, en, …).\n• --help — elenco completo opzioni.\n
