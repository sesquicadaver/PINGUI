about.summary=Monitors RTT and routes for up to 10 targets (IPv4/IPv6 literal or hostname). Session: RAM or SQLite (Settings → Database…). Telemetry / LOG sinks: Settings → Telemetry… (YAML telemetry:).
help.title=PINGUI help
help.header=Quick help
help.documentation=Documentation:
help.expert_linux=Expert (Linux) — Exten. sets iputils ping(8) parameters.
help.expert_unavailable=Expert is unavailable on this OS (Linux + iputils ping only).
help.accelerators=Keyboard shortcuts\n• F1 — Help\n• Ctrl/Cmd+S — Save (YAML)\n• Ctrl/Cmd+N — Add target (from input field)\n
help.body=Profiles and targets\n• Multiple tracing profiles in one YAML; switch via Profile.\n• Up to 10 IP (IPv4/IPv6 literal) or hostname; checkbox enables host monitoring.\n• IPv6 literal — trace via traceroute -6; on Linux with raw ICMP — auto fallback to process.\n• Ping only — RTT to the target without traceroute (recommended on Windows).\n\nUI modes\n• Simple — compact list with RTT metrics and loss %.\n• Extended — hop graph and route-change journal.\n• Graph: wheel — zoom, drag — pan, hover — tooltip; double-click hop — copy IP.\n• {0}\n\nSettings\n• Database… — SQLite session (route_change history), not a telemetry archive.\n• Profile… — interval / max_hops / timeout / probe of the active profile; Apply + Save.\n• Alerts… — desktop / webhook / rate_limit; endpoint_down + latency_high (EWMA AVG); FIRING ≈ fail_after × interval; Apply + Save.\n• Telemetry… — sinks (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only; Apply + Save.\n• Export now… — CSV/HTML session report (like CLI --export-report); needs SQLite session.\n• persistence.session_db ≠ telemetry.sqlite (different roles).\n\nExpert ping (Linux)\n• Expert → Exten. / MTU — presets, MTU wizard and Self-check (DF/DSCP/Burst → Alert).\n• “MTU probe” preset ≠ MTU sweep: use MTU / “MTU wizard…” (sweep -s + -M do → Apply).\n• Self-check — short DF/DSCP/Burst preset batch with ProgressBar; does not change the Expert form.\n\n{1}CLI (terminal)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sinks.\n• --lang CODE — UI language (uk, en, …).\n• --help — full option list.\n
