about.summary=Sleduje RTT a trasy až k 10 cílům (IPv4/IPv6 literal nebo hostname). Relace: RAM nebo SQLite (Nastavení → Databáze…). Telemetrie / LOG sinky: Nastavení → Telemetrie… (YAML telemetry:).
help.title=Nápověda PINGUI
help.header=Stručná nápověda
help.documentation=Dokumentace:
help.expert_linux=Expert (Linux) — Exten. nastavuje parametry ping(8) iputils.
help.expert_unavailable=Expert není na tomto OS dostupný (jen Linux, iputils ping).
help.accelerators=Klávesové zkratky\n• F1 — Nápověda\n• Ctrl/Cmd+S — Uložit (YAML)\n• Ctrl/Cmd+N — Přidat cíl\n
help.body=Profily a cíle\n• Více profilů trasování v jednom YAML; přepínání — Profil.\n• Až 10 IP (IPv4/IPv6 literal) nebo hostname; zaškrtnutí zapíná monitoring.\n• IPv6 literal — trace přes traceroute -6; na Linuxu s raw ICMP — auto fallback na process.\n• Ping only — jen RTT bez traceroute (doporučeno na Windows).\n\nRežimy UI\n• Jednoduchý — kompaktní seznam s RTT a loss %.\n• Rozšířený — graf hopů a deník změn trasy.\n• Graf: kolečko — zoom, tažení — pan, hover — tooltip; dvojklik — kopírovat IP.\n• {0}\n\nNastavení\n• Databáze… — relace SQLite (historie route_change), ne archiv telemetrie.\n• Profil… — interval / max_hops / timeout / probe; Použít + Uložit.\n• Upozornění… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetrie… — sinky (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Exportovat nyní… — report CSV/HTML (jako --export-report); vyžaduje SQLite.\n• persistence.session_db ≠ telemetry.sqlite (různé role).\n\nExpert ping (Linux)\n• Expert → Exten. / MTU — presety, MTU wizard a Self-check (DF/DSCP/Burst → Alert).\n• Preset „MTU probe“ ≠ prohledání MTU: použijte MTU / „MTU wizard…“ (sweep -s + -M do → Použít).\n• Self-check — krátký batch DF/DSCP/Burst s ProgressBar; nemění formulář Expert.\n\n{1}CLI (terminál)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sinků.\n• --lang CODE — jazyk UI (uk, en, …).\n• --help — úplný seznam voleb.\n
