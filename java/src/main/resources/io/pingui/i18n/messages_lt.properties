about.summary=Stebi RTT ir maršrutus iki 10 tikslų (IPv4/IPv6 literal arba hostname). Sesija: RAM arba SQLite (Nuostatos → Duomenų bazė…). Telemetrija / LOG sink: Nuostatos → Telemetrija… (YAML telemetry:).
help.title=PINGUI pagalba
help.header=Trumpa pagalba
help.documentation=Dokumentacija:
help.expert_linux=Ekspertas (Linux) — Exten. nustato ping(8) iputils parametrus.
help.expert_unavailable=Ekspertas neprieinamas šioje OS (tik Linux, iputils ping).
help.accelerators=Spartieji klavišai\n• F1 — Pagalba\n• Ctrl/Cmd+S — Įrašyti (YAML)\n• Ctrl/Cmd+N — Pridėti tikslą\n
help.body=Profiliai ir tikslai\n• Keli sekimo profiliai viename YAML; perjungimas — Profilis.\n• Iki 10 IP (IPv4/IPv6 literal) arba hostname; žymimasis langelis įjungia stebėjimą.\n• IPv6 literal — trace per traceroute -6; Linux su raw ICMP — auto fallback į process.\n• Ping only — tik RTT be traceroute (rekomenduojama Windows).\n\nUI režimai\n• Paprastas — kompaktiškas sąrašas su RTT ir loss %.\n• Išplėstinis — hop grafas ir maršruto pokyčių žurnalas.\n• Grafas: ratukas — zoom, vilkimas — pan, hover — tooltip; dukart spustelėjimas — kopijuoti IP.\n• {0}\n\nNuostatos\n• Duomenų bazė… — SQLite sesija (route_change istorija), ne telemetrijos archyvas.\n• Profilis… — interval / max_hops / timeout / probe; Taikyti + Įrašyti.\n• Įspėjimai… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetrija… — sink (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Eksportuoti dabar… — CSV/HTML ataskaita (kaip --export-report); reikia SQLite.\n• persistence.session_db ≠ telemetry.sqlite (skirtingos rolės).\n\nExpert ping (Linux)\n• Ekspertas → Exten. / MTU — presets, MTU wizard ir Self-check (DF/DSCP/Burst → Alert).\n• Preset „MTU probe“ ≠ MTU perrinkimas: naudokite MTU / „MTU wizard…“ (sweep -s + -M do → Taikyti).\n• Self-check — trumpas DF/DSCP/Burst batch su ProgressBar; nekeičia Expert formos.\n\n{1}CLI (terminalas)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sink.\n• --lang CODE — UI kalba (uk, en, …).\n• --help — visas parinkčių sąrašas.\n
