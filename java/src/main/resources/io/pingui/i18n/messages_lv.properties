about.summary=Uzrauga RTT un maršrutus līdz 10 mērķiem (IPv4/IPv6 literal vai hostname). Sesija: RAM vai SQLite (Iestatījumi → Datubāze…). Telemetrija / LOG sink: Iestatījumi → Telemetrija… (YAML telemetry:).
help.title=PINGUI palīdzība
help.header=Īsa palīdzība
help.documentation=Dokumentācija:
help.expert_linux=Eksperts (Linux) — Exten. iestata ping(8) iputils parametrus.
help.expert_unavailable=Eksperts nav pieejams šajā OS (tikai Linux, iputils ping).
help.accelerators=Īsceļi\n• F1 — Palīdzība\n• Ctrl/Cmd+S — Saglabāt (YAML)\n• Ctrl/Cmd+N — Pievienot mērķi\n
help.body=Profili un mērķi\n• Vairāki izsekošanas profili vienā YAML; pārslēgšana — Profils.\n• Līdz 10 IP (IPv4/IPv6 literal) vai hostname; izvēles rūtiņa ieslēdz monitoringu.\n• IPv6 literal — trace ar traceroute -6; Linux ar raw ICMP — auto fallback uz process.\n• Ping only — tikai RTT bez traceroute (ieteicams Windows).\n\nUI režīmi\n• Vienkāršs — kompakts saraksts ar RTT un loss %.\n• Paplašināts — hop grafs un maršruta izmaiņu žurnāls.\n• Grafs: ritenis — zoom, vilkšana — pan, hover — tooltip; dubultklikšķis — kopēt IP.\n• {0}\n\nIestatījumi\n• Datubāze… — SQLite sesija (route_change vēsture), ne telemetrijas arhīvs.\n• Profils… — interval / max_hops / timeout / probe; Lietot + Saglabāt.\n• Brīdinājumi… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetrija… — sink (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Eksportēt tagad… — CSV/HTML atskaite (kā --export-report); vajag SQLite.\n• persistence.session_db ≠ telemetry.sqlite (dažādas lomas).\n\nExpert ping (Linux)\n• Eksperts → Exten. / MTU — presets, MTU wizard un Self-check (DF/DSCP/Burst → Alert).\n• Preset „MTU probe” ≠ MTU pārlase: lietojiet MTU / „MTU wizard…” (sweep -s + -M do → Lietot).\n• Self-check — īss DF/DSCP/Burst batch ar ProgressBar; nemaina Expert formu.\n\n{1}CLI (terminālis)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sink.\n• --lang CODE — UI valoda (uk, en, …).\n• --help — pilns opciju saraksts.\n
