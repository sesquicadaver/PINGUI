about.summary=Monitoruje RTT i trasy do 10 celów (IPv4/IPv6 literal lub hostname). Sesja: RAM lub SQLite (Ustawienia → Baza danych…). Telemetria / sinki LOG: Ustawienia → Telemetria… (YAML telemetry:).
help.title=Pomoc PINGUI
help.header=Krótka pomoc
help.documentation=Dokumentacja:
help.expert_linux=Ekspert (Linux) — Exten. ustawia parametry ping(8) iputils.
help.expert_unavailable=Ekspert niedostępny na tym SO (tylko Linux, iputils ping).
help.accelerators=Skróty\n• F1 — Pomoc\n• Ctrl/Cmd+S — Zapisz (YAML)\n• Ctrl/Cmd+N — Dodaj cel\n
help.body=Profile i cele\n• Wiele profili śledzenia w jednym YAML; przełączanie — Profil.\n• Do 10 IP (IPv4/IPv6 literal) lub hostname; checkbox włącza monitoring.\n• IPv6 literal — trace przez traceroute -6; na Linux z raw ICMP — auto fallback na process.\n• Ping only — tylko RTT bez traceroute (zalecane na Windows).\n\nTryby UI\n• Prosty — zwarta lista z RTT i loss %.\n• Rozszerzony — graf hopów i dziennik zmian trasy.\n• Graf: kółko — zoom, przeciąganie — pan, hover — tooltip; podwójne kliknięcie — kopiuj IP.\n• {0}\n\nUstawienia\n• Baza danych… — sesja SQLite (historia route_change), nie archiwum telemetrii.\n• Profil… — interval / max_hops / timeout / probe; Zastosuj + Zapisz.\n• Alerty… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetria… — sinki (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Eksportuj teraz… — raport CSV/HTML (jak --export-report); wymaga SQLite.\n• persistence.session_db ≠ telemetry.sqlite (różne role).\n\nExpert ping (Linux)\n• Ekspert → Exten. / MTU — preset, MTU wizard i Self-check (DF/DSCP/Burst → Alert).\n• Preset „MTU probe” ≠ przeczesanie MTU: użyj MTU / „MTU wizard…” (sweep -s + -M do → Zastosuj).\n• Self-check — krótki batch DF/DSCP/Burst z ProgressBar; nie zmienia formularza Expert.\n\n{1}CLI (terminal)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sinków.\n• --lang CODE — język UI (uk, en, …).\n• --help — pełna lista opcji.\n
