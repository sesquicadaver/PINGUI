help.header=Lühike abi
help.documentation=Dokumentatsioon:
help.expert_linux=Ekspert (Linux) — Exten. seab ping(8) iputils parameetrid.
help.expert_unavailable=Ekspert pole selles OS-is saadaval (ainult Linux, iputils ping).
help.accelerators=Kiirklahvid\n• F1 — Abi\n• Ctrl/Cmd+S — Salvesta (YAML)\n• Ctrl/Cmd+N — Lisa siht\n
help.body=Profiilid ja sihid\n• Mitu jälgimisprofiili ühes YAML-is; vahetamine — Profiil.\n• Kuni 10 IP-d (IPv4/IPv6 literal) või hostname; märkeruut lubab monitooringu.\n• IPv6 literal — trace traceroute -6 kaudu; Linuxis raw ICMP-ga — auto fallback process’ile.\n• Ping only — ainult RTT ilma traceroute’ta (soovitatav Windowsis).\n\nUI-režiimid\n• Lihtne — kompaktne loend RTT ja loss % näitudega.\n• Laiendatud — hopi graaf ja marsruudimuudatuste päevik.\n• Graaf: ratas — zoom, lohistamine — pan, hover — tooltip; topeltklõps — kopeeri IP.\n• {0}\n\nSeaded\n• Andmebaas… — SQLite seanss (route_change ajalugu), mitte telemeetria arhiiv.\n• Profiil… — interval / max_hops / timeout / probe; Rakenda + Salvesta.\n• Märguanded… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemeetria… — sinkid (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Ekspordi kohe… — CSV/HTML aruanne (nagu --export-report); vajab SQLite’i.\n• persistence.session_db ≠ telemetry.sqlite (erinevad rollid).\n\nExpert ping (Linux)\n• Ekspert → Exten. / MTU — presetid, MTU wizard ja Self-check (DF/DSCP/Burst → Alert).\n• Preset „MTU probe“ ≠ MTU skaneering: kasutage MTU / „MTU wizard…“ (sweep -s + -M do → Rakenda).\n• Self-check — lühike DF/DSCP/Burst batch ProgressBariga; ei muuda Expert-vormi.\n\n{1}CLI (terminal)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — sinkide override.\n• --lang CODE — UI keel (uk, en, …).\n• --help — täielik valikute loend.\n
