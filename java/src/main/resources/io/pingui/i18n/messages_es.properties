about.summary=Monitorea RTT y rutas de hasta 10 destinos (IPv4/IPv6 literal o hostname). Sesión: RAM o SQLite (Ajustes → Base de datos…). Telemetría / sinks LOG: Ajustes → Telemetría… (YAML telemetry:).
help.title=Ayuda de PINGUI
help.header=Ayuda rápida
help.documentation=Documentación:
help.expert_linux=Experto (Linux) — Exten. define parámetros de ping(8) iputils.
help.expert_unavailable=Experto no disponible en este SO (solo Linux, iputils ping).
help.accelerators=Atajos\n• F1 — Ayuda\n• Ctrl/Cmd+S — Guardar (YAML)\n• Ctrl/Cmd+N — Añadir destino\n
help.body=Perfiles y destinos\n• Varios perfiles de trazado en un YAML; cambio con Perfil.\n• Hasta 10 IP (IPv4/IPv6 literal) o hostname; la casilla activa el monitoreo.\n• IPv6 literal — trace con traceroute -6; en Linux con ICMP raw — fallback a process.\n• Ping only — solo RTT sin traceroute (recomendado en Windows).\n\nModos de UI\n• Simple — lista compacta con RTT y loss %.\n• Extendido — grafo de hops y diario de cambios.\n• Grafo: rueda — zoom, arrastre — pan, hover — tooltip; doble clic — copiar IP.\n• {0}\n\nAjustes\n• Base de datos… — sesión SQLite (historial route_change), no archivo de telemetría.\n• Perfil… — interval / max_hops / timeout / probe; Aplicar + Guardar.\n• Alertas… — desktop / webhook / rate_limit; endpoint_down + notify_resolved.\n• Telemetría… — sinks (sqlite/jsonl/syslog/GELF/Loki/OTLP), events_only.\n• Exportar ahora… — informe CSV/HTML (como --export-report); requiere SQLite.\n• persistence.session_db ≠ telemetry.sqlite (roles distintos).\n\nExpert ping (Linux)\n• Experto → Exten. / MTU — presets, MTU wizard y Self-check (DF/DSCP/Burst → Alert).\n• Preset “MTU probe” ≠ barrido MTU: use MTU / “MTU wizard…” (sweep -s + -M do → Aplicar).\n• Self-check — lote corto DF/DSCP/Burst con ProgressBar; no cambia el formulario Expert.\n\n{1}CLI (terminal)\n• ./pingui-java.sh [--config PATH] …\n• --telemetry-syslog / --telemetry-jsonl / --telemetry-otlp — override sinks.\n• --lang CODE — idioma UI (uk, en, …).\n• --help — lista completa de opciones.\n
